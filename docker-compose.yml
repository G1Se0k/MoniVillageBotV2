services:
  bot:
    build: .
    container_name: monivillagebot
    env_file:
      - .env
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY}
    container_name: monivillagebot-web
    env_file:
      - .env
      - packages/web/.env.local
    ports:
      - "3000:3000"
    restart: unless-stopped
