services:
  bot:
    build: .
    container_name: monivillagebot
    env_file:
      - .env
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: monivillagebot-web
    env_file:
      - .env
      - path: packages/web/.env.local
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
