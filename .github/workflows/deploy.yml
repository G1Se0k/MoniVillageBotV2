name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH & docker compose up
        uses: appleboy/ssh-action@v1
        with:
          host: ssh.mirattic.com
          port: 22
          username: giseok
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /Users/giseok/Documents/MoniVillageBotV2
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
